# Pipeline CI/CD: chạy test bằng Gradle Wrapper rồi build và đẩy Docker image lên GHCR
name: Broken Pipeline - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: chạy kiểm thử đơn vị bằng Gradle Wrapper
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew
      - name: Chạy test bằng Gradle Wrapper
        run: ./gradlew test --no-daemon

  # Job 2: build Docker image và đẩy lên GitHub Container Registry
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKKEN }}

      - name: Build và đẩy Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
