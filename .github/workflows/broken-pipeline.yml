# Pipeline CI/CD (bản đã sửa): chạy test bằng Gradle Wrapper rồi build và đẩy Docker image lên GHCR
name: Broken Pipeline - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: chạy kiểm thử đơn vị bằng Gradle Wrapper
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # [FIX 1] Cấp quyền thực thi cho gradlew: file được commit từ Windows với mode 100644,
      # nên trên runner Linux chạy ./gradlew sẽ bị "Permission denied" nếu không chmod trước
      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Chạy test bằng Gradle Wrapper
        run: ./gradlew test --no-daemon

  # Job 2: build Docker image và đẩy lên GitHub Container Registry
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [FIX 2] Sửa chính tả tên secret: REGISTRY_TOKKEN -> REGISTRY_TOKEN
      # (secret sai tên được GitHub thay bằng chuỗi rỗng nên login báo "Password required")
      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Sinh tag cho image: sha ngắn của commit và latest (tên image tự động chuyển chữ thường)
      - name: Sinh metadata và tag cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      # [FIX 3] Build context là thư mục gốc repo và Dockerfile nằm ở gốc repo:
      # context: ./app và file: ./docker/Dockerfile đều không tồn tại
      - name: Build và đẩy Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
